name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --legacy-peer-deps: evita un bug de npm 11 con los peer deps de eslint/vitest.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Placeholder: stripe.js exige una llave no vacía al importarse; el smoke test no la usa.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # --legacy-peer-deps: evita un bug de npm 11 con los peer deps de eslint/vitest.
      - run: npm ci --legacy-peer-deps
      - run: npm run test:emulator
