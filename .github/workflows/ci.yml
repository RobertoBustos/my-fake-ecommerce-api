name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Placeholder: src/config/stripe.js needs a non-empty key at import time; no test calls Stripe for real.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run test:emulator

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t my-fake-ecommerce-api:ci .
      - run: |
          docker run -d --name api-ci -p 8080:8080 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            my-fake-ecommerce-api:ci
      # The container needs a moment to boot; poll instead of a fixed sleep.
      - run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/healthcheck; then exit 0; fi
            sleep 2
          done
          echo "::error::/healthcheck never became healthy" >&2
          exit 1
      - if: always()
        run: docker logs api-ci
      - if: always()
        run: docker rm -f api-ci

  # main only receives releases and hotfixes. Required on main; on any other
  # base branch the job is skipped, which GitHub counts as passing.
  branch-guard:
    name: branch-guard
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "OK: $HEAD_REF may target main" ;;
            *)
              echo "::error::Pull requests into main must come from release/* or hotfix/* (got '$HEAD_REF')." >&2
              exit 1
              ;;
          esac
