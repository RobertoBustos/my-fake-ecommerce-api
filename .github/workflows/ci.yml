name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --legacy-peer-deps: works around an npm 11 bug resolving the eslint/vitest peer deps.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Placeholder: src/config/stripe.js needs a non-empty key at import time; no test calls Stripe for real.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # --legacy-peer-deps: works around an npm 11 bug resolving the eslint/vitest peer deps.
      - run: npm ci --legacy-peer-deps
      - run: npm run test:emulator

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t my-fake-ecommerce-api:ci .
      - run: |
          docker run -d --name api-ci -p 8080:8080 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            my-fake-ecommerce-api:ci
      # The container needs a moment to boot; poll instead of a fixed sleep.
      - run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/healthcheck; then exit 0; fi
            sleep 2
          done
          echo "::error::/healthcheck never became healthy" >&2
          exit 1
      - if: always()
        run: docker logs api-ci
      - if: always()
        run: docker rm -f api-ci
