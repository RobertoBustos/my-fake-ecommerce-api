name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --legacy-peer-deps evita un bug de npm 11 al resolver el árbol de
      # peer dependencies de eslint/vitest (TypeError: Cannot read
      # properties of null (reading 'edgesOut') en @npmcli/arborist).
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # El import de resolvers.js carga config/stripe.js, que construye el
      # cliente de Stripe en cuanto se importa el módulo. El smoke test nunca
      # llama a la API de Stripe, pero el constructor necesita una llave no
      # vacía para no tronar. Este valor es un placeholder, no una llave real.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test
